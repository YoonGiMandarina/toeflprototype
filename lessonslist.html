    <script>

            const LESSONS_DATABASE = {

    // =========================================================================

    // Módulo 4 de Reading (Vocabulary Skills)
            "reading-1": {
                title: "Understanding the Passage",
                desc: "Find the main idea and understand how ideas are organized.",
                icon: "📖",
                items: [
                    {
                        id: 1,
                        name: "Finding the Main Idea",
                        skillText: "Okay, here's the thing about main idea questions — they're not about one tiny detail. They're about the whole point of the passage. If a friend asked 'what was that about?', your one-sentence answer is the main idea.",
                        strategyText: "Read the first sentence of each paragraph — that's usually where the big idea hides. Then ask yourself, 'What is this passage mostly about?'",
                        examples: [

                    {
                        exampleSentence: "Passage: 'Bats are among the most misunderstood animals on Earth. They use a system called echolocation to hunt insects in complete darkness. Most species sleep hanging upside down in caves, trees, or old buildings. Despite their reputation, very few bats carry diseases that affect humans.'",
                        exampleQuestion: "What is the main idea of this passage?",
                        options: ["Bats sleep upside down","Bats live in old buildings","Bats are commonly misunderstood but have unique, impressive traits","Bats carry dangerous diseases"],
                        correctAnswer: 2,
                        detailedFeedback: "Let's see why this works! Every sentence supports one big idea: bats have fascinating traits that are often misunderstood. The other options are just single details, not the whole picture. This trick works for lots of passages, not just this one. Awesome progress!"
                    },

                    {
                        exampleSentence: "Passage: 'Coffee began as a small crop in Ethiopia centuries ago. Traders carried it across Africa and the Middle East, where it became part of daily social life. By the 1600s, coffeehouses had spread through Europe, becoming centers for conversation and business. Today, coffee is one of the most traded goods in the world.'",
                        exampleQuestion: "What is the main idea?",
                        options: ["Coffee has a long history and became a major global product","Coffee started in Ethiopia","Coffee is traded today","Coffeehouses were popular in Europe"],
                        correctAnswer: 0,
                        detailedFeedback: "Let's keep learning! The passage moves through time, origin, spread, and today, all building toward one idea: coffee's long journey to becoming a global product. This is exactly the kind of clue passages love to hide. Great thinking!"
                    },

                    {
                        exampleSentence: "Passage: 'Honeybees play a critical role in food production. As they move from flower to flower collecting nectar, they transfer pollen that allows plants to reproduce. Without this process, many fruits and vegetables would not grow. Scientists have grown concerned as bee populations decline worldwide.'",
                        exampleQuestion: "What is the main idea?",
                        options: ["Fruits need pollen","Scientists study bees","Bees collect nectar","Bees are essential for food production, and their decline is worrying"],
                        correctAnswer: 3,
                        detailedFeedback: "Let's make this easier! The passage isn't just describing bee behavior, it's building toward the bigger point: bees matter for our food supply, and losing them is a real concern. Passages often hide the answer in plain sight like this. Nice work! On to the next one."
                    },

                    {
                        exampleSentence: "Passage: 'The city library recently renovated its main building. New computer stations were added for research, and a quiet study area was created on the second floor. The children's section now includes an interactive reading corner. These changes came after community members requested more modern resources.'",
                        exampleQuestion: "What is the main idea?",
                        options: ["The library was renovated to meet community needs for modern resources","The library has two floors","Children like reading corners","The library added computers"],
                        correctAnswer: 0,
                        detailedFeedback: "Let's figure this out together! Each change described supports one central idea: the renovation happened because the community asked for it. Reading closely like this will help you on many questions. Great thinking!"
                    },

                    {
                        exampleSentence: "Passage: 'Hurricanes form over warm ocean waters when moist air rises and creates a rotating storm system. As they gather strength, wind speeds can exceed 150 miles per hour. Coastal cities often evacuate residents ahead of a hurricane's arrival. Even after landfall, flooding can continue to cause damage for days.'",
                        exampleQuestion: "What is the main idea?",
                        options: ["Hurricanes have strong winds","Coastal cities evacuate people","Flooding lasts for days","Hurricanes form over the ocean and can cause serious, lasting damage"],
                        correctAnswer: 3,
                        detailedFeedback: "Let's see why this works! The passage explains formation, strength, and impact, all pointing to one big idea: hurricanes are dangerous storms with lasting effects. Spotting clues like this gets easier with practice. Keep going, you're doing great!"
                    }

                ]                
                    },
                
                    {
                        id: 2,
                        name: "Recognizing Organization",
                        skillText: "Passages don't just throw facts at you randomly — writers organize ideas on purpose, like comparing two things or explaining a cause and effect. Spot the pattern, and the passage gets so much easier to follow.",
                        strategyText: "Watch for clue words like however, because, or similarly. They're little signs telling you where the passage is headed.",
                        examples: [

                    {
                        exampleSentence: "Passage: The Nile and the Amazon are both massive rivers, but they differ in important ways. The Nile is the longest river in the world, stretching over 4,100 miles. However, the Amazon carries far more water, discharging more volume than the next seven largest rivers combined.",
                        exampleQuestion: "How is this passage organized?",
                        options: ["A definition","A list of events","Comparison and contrast","Cause and effect"],
                        correctAnswer: 2,
                        detailedFeedback: "Let's break it down together! The passage sets up two rivers side by side and highlights their differences using however, a clear signal of comparison and contrast. Reading closely like this will help you on many questions. You're improving every day!"
                    },

                    {
                        exampleSentence: "Passage: Deforestation removes trees that once held soil in place. Without root systems, heavy rains wash the soil away, a process called erosion. This eroded soil clogs rivers and reduces farmland fertility, leading to lower crop yields for nearby communities.",
                        exampleQuestion: "How is this passage organized?",
                        options: ["A sequence of historical events","Cause and effect","Comparison","A general definition"],
                        correctAnswer: 1,
                        detailedFeedback: "Every question helps you improve! Each sentence builds on the previous one: no trees leads to erosion, which leads to river damage, which leads to lower crop yields. That's a cause-and-effect chain. Spotting clues like this gets easier with practice. You've got this!"
                    },

                    {
                        exampleSentence: "Passage: Making bread involves several steps. First, flour, water, yeast, and salt are combined into a dough. Next, the dough is kneaded and left to rise for an hour. Finally, it is shaped and baked in a hot oven until golden brown.",
                        exampleQuestion: "How is this passage organized?",
                        options: ["An opinion","A cause and effect","A comparison","A sequence of steps"],
                        correctAnswer: 3,
                        detailedFeedback: "Let's make this easier! Words like first, next, and finally show that this passage is organized as a step-by-step process. This trick works for lots of passages, not just this one. Keep it up!"
                    },

                    {
                        exampleSentence: "Passage: Urban traffic congestion is a growing problem. City planners have proposed several solutions. One option is expanding public transportation to reduce car dependency. Another is charging drivers a fee to enter busy areas during peak hours.",
                        exampleQuestion: "How is this passage organized?",
                        options: ["A single detailed description","Problem and possible solutions","A comparison of two cities","A story with a beginning and end"],
                        correctAnswer: 1,
                        detailedFeedback: "Every question helps you improve! The passage introduces a problem, congestion, and then offers solutions, a classic problem-solution structure. Spotting clues like this gets easier with practice. Nice work! On to the next one."
                    },

                    {
                        exampleSentence: "Passage: Renewable energy comes in several forms. Solar panels convert sunlight directly into electricity. Wind turbines use moving air to spin generators. Hydropower captures the energy of flowing water. Each method reduces reliance on fossil fuels.",
                        exampleQuestion: "How is this passage organized?",
                        options: ["Comparison and contrast","Cause and effect","Chronological order","A list of examples"],
                        correctAnswer: 3,
                        detailedFeedback: "Let's see why this works! The passage introduces a general category, renewable energy, and then lists specific examples one by one. Passages often hide the answer in plain sight like this. You've got this!"
                    }

                ]
                    }
                ]
            },

            "reading-2": {
                title: "Directly Answered Questions",
                desc: "Locate details, unstated information, and references.",
                icon: "🔍",
                items: [
                    { 
                        id: 1, 
                        name: "Stated Details",
                        skillText: "Some questions ask about facts stated directly in the passage — no guessing needed! The answer is right there in the text, sometimes just worded a little differently.",
                        strategyText: "Scan for key words from the question, then read the sentence right around them carefully.",
                        examples: [

                        {
                            exampleSentence: "Passage: The Amazon Rainforest produces about 20 percent of the world's oxygen and is home to more than 10 percent of all known species on Earth. It covers roughly 2.1 million square miles across South America.",
                            exampleQuestion: "What percentage of the world's oxygen does the Amazon produce?",
                            options: ["10 percent","2.1 percent","Not stated","20 percent"],
                            correctAnswer: 3,
                            detailedFeedback: "Let's see why this works! The exact figure, 20 percent, appears directly in the passage. Always double check you matched the right number to the right fact. Reading closely like this will help you on many questions. Well done!"
                        },

                        {
                            exampleSentence: "Passage: The Great Wall of China was built over many centuries by different dynasties, primarily to protect against invasions from the north. Today, it stretches for more than 13,000 miles, including all its branches and extensions.",
                            exampleQuestion: "How long is the Great Wall of China today?",
                            options: ["More than 13,000 miles","1,700 miles","19,341 miles","2.1 million miles"],
                            correctAnswer: 0,
                            detailedFeedback: "Let's build your TOEFL skills together! The passage gives the number directly. Watch out for similar-looking numbers from other passages showing up as wrong choices. This trick works for lots of passages, not just this one. You've got this!"
                        },

                        {
                            exampleSentence: "Passage: The Eiffel Tower was completed in 1889 for the World's Fair in Paris. It stood as the tallest man-made structure in the world for 41 years, until the Chrysler Building was completed in New York.",
                            exampleQuestion: "How long was the Eiffel Tower the tallest man-made structure?",
                            options: ["Not mentioned","13,000 years","41 years","1889 years"],
                            correctAnswer: 2,
                            detailedFeedback: "Let's keep learning! The stated detail is right there: 41 years. Simple, direct facts like this just need a careful re-read of the passage. Passages often hide the answer in plain sight like this. Keep going, you're doing great!"
                        }

                    ]
                    },
                    { 
                        id: 2, 
                        name: "Unstated Details",
                        skillText: "These questions ask what the passage does NOT say. Three answer choices are true, and one is either false or just never mentioned.",
                        strategyText: "Check each answer choice against the passage one by one. Cross off what you find — the one left over is your answer.",
                        examples: [

                        {
                            exampleSentence: "Passage: The museum's new exhibit features paintings from the 1800s, sculptures made of bronze, and photographs donated by a local collector. Admission is free on the first Sunday of every month.",
                            exampleQuestion: "Which is NOT mentioned as part of the exhibit?",
                            options: ["Sculptures","Ticket prices","Paintings","Photographs"],
                            correctAnswer: 1,
                            detailedFeedback: "Let's break it down together! The passage never gives a specific ticket price, it only mentions the free admission day. Always check each choice against the text one by one. This trick works for lots of passages, not just this one. Well done!"
                        },

                        {
                            exampleSentence: "Passage: The new smartphone model features a larger screen, improved battery life, and a faster processor. It also comes in three different colors.",
                            exampleQuestion: "Which is NOT mentioned about the smartphone?",
                            options: ["Battery life","Screen size","Price","Processor speed"],
                            correctAnswer: 2,
                            detailedFeedback: "Let's uncover the answer together! Colors, screen, battery, and processor are all mentioned, but price is never stated. Spotting clues like this gets easier with practice. You've got this!"
                        },

                        {
                            exampleSentence: "Passage: The hiking trail winds through a dense forest, crosses two wooden bridges, and ends at a scenic waterfall. Hikers are advised to bring water and wear sturdy shoes.",
                            exampleQuestion: "Which is NOT mentioned about the trail?",
                            options: ["Sturdy shoes are recommended","It takes three hours to complete","It ends at a waterfall","It crosses bridges"],
                            correctAnswer: 1,
                            detailedFeedback: "You're learning something new today! Time to complete the hike is never mentioned in the passage, everything else is directly stated. Passages often hide the answer in plain sight like this. Keep it up!"
                        },

                        {
                            exampleSentence: "Passage: The company's new policy allows employees to work from home twice a week, provides a stipend for home office equipment, and offers flexible start times between 8 and 10 a.m.",
                            exampleQuestion: "Which is NOT mentioned in the new policy?",
                            options: ["Additional vacation days","Equipment stipend","Work-from-home days","Flexible start times"],
                            correctAnswer: 0,
                            detailedFeedback: "Let's uncover the answer together! Vacation days are never discussed in this passage. This is a classic case of an answer that sounds reasonable but simply isn't there. Spotting clues like this gets easier with practice. Awesome progress!"
                        },

                        {
                            exampleSentence: "Passage: The recipe calls for two cups of flour, one cup of sugar, three eggs, and a teaspoon of vanilla extract. It should bake for 35 minutes at 350 degrees.",
                            exampleQuestion: "Which is NOT mentioned in the recipe?",
                            options: ["Baking time","Amount of butter","Baking temperature","Amount of flour"],
                            correctAnswer: 1,
                            detailedFeedback: "Let's build your TOEFL skills together! Butter is never mentioned in this recipe. Always compare each option carefully against what's actually written. Reading closely like this will help you on many questions. You're improving every day!"
                        }

                    ]
                    },
                    { 
                        id: 3, 
                        name: "Pronoun Referents",
                        skillText: "Words like it, they, or this point back to something mentioned earlier in the passage. These questions simply ask: what is that something?",
                        strategyText: "Look at the sentence right before the pronoun — the answer is almost always close by.",
                        examples: [

                    {
                        exampleSentence: "Passage: Marine biologists have been tracking a pod of orcas along the coast for over a decade. They have noticed the whales returning to the same feeding grounds each summer.",
                        exampleQuestion: "What does They refer to?",
                        options: ["The feeding grounds","The orcas","The coast","The marine biologists"],
                        correctAnswer: 3,
                        detailedFeedback: "Every question helps you improve! They refers back to the marine biologists, the subject doing the noticing. Always check the sentence right before the pronoun. Spotting clues like this gets easier with practice. Keep going, you're doing great!"
                    },

                    {
                        exampleSentence: "Passage: The city built a new subway line to reduce traffic congestion. It connects downtown to the airport in under twenty minutes.",
                        exampleQuestion: "What does It refer to?",
                        options: ["The airport","The subway line","The traffic","The city"],
                        correctAnswer: 1,
                        detailedFeedback: "You're one step closer to your goal! It replaces the subway line, the thing being described as connecting two places. This is exactly the kind of clue passages love to hide. You're improving every day!"
                    },

                    {
                        exampleSentence: "Passage: Farmers rely heavily on seasonal rainfall to grow their crops. When it fails to arrive on time, entire harvests can be lost.",
                        exampleQuestion: "What does it refer to?",
                        options: ["The farmers","The harvest","The crops","The rainfall"],
                        correctAnswer: 3,
                        detailedFeedback: "Let's figure this out together! It points back to seasonal rainfall, the subject of the previous clause. Reading closely like this will help you on many questions. Nice work! On to the next one."
                    },

                    {
                        exampleSentence: "Passage: Researchers studied ancient pottery found at the site. They believe it was used for storing grain thousands of years ago.",
                        exampleQuestion: "What does it refer to?",
                        options: ["The grain","The pottery","The site","The researchers"],
                        correctAnswer: 1,
                        detailedFeedback: "You're one step closer to your goal! It refers to the pottery, the object being discussed just before the pronoun appears. This is exactly the kind of clue passages love to hide. Well done!"
                    },

                    {
                        exampleSentence: "Passage: The company launched a new app last year. It quickly became one of the most downloaded tools in its category.",
                        exampleQuestion: "What does It refer to?",
                        options: ["The company","The category","The year","The app"],
                        correctAnswer: 3,
                        detailedFeedback: "Let's uncover the answer together! It replaces the new app, the subject that became popular. Spotting clues like this gets easier with practice. Nice work! On to the next one."
                    }

                ]
                    }
                ]
            },

            "reading-3": {
                title: "Indirectly Answered Questions",
                desc: "Make logical conclusions based on what you read.",
                icon: "🧩",
                items: [
                    { 
                        id: 1, 
                        name: "Implied Details",
                        skillText: "Sometimes the passage doesn't say something directly, but you can figure it out from the clues it gives you. That's an implied detail.",
                        strategyText: "Combine what the passage does say with a little logic — you're reading between the lines.",
                        examples: [

                        {
                            exampleSentence: "Passage: Sarah checked her watch every few minutes and kept glancing toward the door. Her leg bounced nervously under the table as the minutes ticked by.",
                            exampleQuestion: "What can you infer about Sarah?",
                            options: ["She is reading","She is waiting anxiously for someone","She is relaxed","She is asleep"],
                            correctAnswer: 1,
                            detailedFeedback: "Let's build your TOEFL skills together! None of this is stated directly, but checking the time, watching the door, and nervous movement all point to anxious waiting. This trick works for lots of passages, not just this one. Great thinking!"
                        },

                        {
                            exampleSentence: "Passage: The store shelves were nearly empty, and a long line stretched out the door. Customers carried carts filled with canned goods and bottled water.",
                            exampleQuestion: "What can you infer is happening?",
                            options: ["People are preparing for an emergency","The store is closing permanently","A sale on canned goods","A regular shopping day"],
                            correctAnswer: 0,
                            detailedFeedback: "Let's see why this works! Empty shelves, long lines, and stockpiling supplies suggest people are preparing for something like a storm or emergency. Reading closely like this will help you on many questions. Awesome progress!"
                        },

                        {
                            exampleSentence: "Passage: After the meeting, the manager avoided eye contact and left the office quickly without saying goodbye to anyone.",
                            exampleQuestion: "What can you infer about the meeting?",
                            options: ["Everyone was happy","Something went wrong or was uncomfortable","It was canceled","It went very well"],
                            correctAnswer: 1,
                            detailedFeedback: "You're learning something new today! Avoiding eye contact and leaving quickly are behavior clues suggesting discomfort, even though nothing is said directly. This trick works for lots of passages, not just this one. Keep going, you're doing great!"
                        },

                        {
                            exampleSentence: "Passage: The garden had not been watered in weeks. Leaves had turned brown, and the soil had cracked in the summer heat.",
                            exampleQuestion: "What can you infer about the garden?",
                            options: ["It is thriving","It receives too much water","It has been neglected","It was recently planted"],
                            correctAnswer: 2,
                            detailedFeedback: "Let's uncover the answer together! Brown leaves and cracked soil imply neglect, even though the word neglected is never used. Passages often hide the answer in plain sight like this. You're improving every day!"
                        },

                        {
                            exampleSentence: "Passage: The child's shoes were caked in mud, and there were grass stains on both knees of her pants.",
                            exampleQuestion: "What can you infer the child was doing?",
                            options: ["Playing outside","Watching television","Doing homework","Sleeping indoors"],
                            correctAnswer: 0,
                            detailedFeedback: "Let's build your TOEFL skills together! Muddy shoes and grass-stained knees strongly imply outdoor, active play. This is exactly the kind of clue passages love to hide. Keep it up!"
                        }

                    ]
                    },
                    { 
                        id: 2, 
                        name: "Transition Questions",
                        skillText: "These questions ask what topic probably comes right before or right after the passage you just read.",
                        strategyText: "Check the very first and very last sentences closely — they usually connect to what came before or what's coming next.",
                        examples: [

                    {
                        exampleSentence: "Passage ending: The introduction of the printing press in the 15th century made books more accessible than ever, setting the stage for widespread literacy across Europe.",
                        exampleQuestion: "What most likely follows this passage?",
                        options: ["The history of the internet","A discussion of literacy's spread in Europe","A description of ancient Egypt","A story about medieval castles"],
                        correctAnswer: 1,
                        detailedFeedback: "Let's see why this works! The passage ends by pointing directly toward literacy's spread, the natural next topic to expand on. Reading closely like this will help you on many questions. Nice work! On to the next one."
                    },

            const key = `${section}-${moduleId}`;

                items: [{ id: 1, name: "Lesson 1: Introduction Strategy" }, { id: 2, name: "Lesson 2: Core Concept Drill" }]

            document.getElementById("mod-title").innerText = data.title;
            document.getElementById("mod-desc").innerText = data.desc;
            document.getElementById("mod-icon").innerText = data.icon;

            const container = document.getElementById("lessons-container");
            data.items.forEach((lesson, index) => {

                    <button onclick="goToLesson('${section}', '${moduleId}', ${lesson.id}, ${data.items.length}, ${index})" class="w-full bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-4 text-left shadow-sm hover:shadow-md hover:border-indigo-100 transition duration-200 cursor-pointer group">

        function goToLesson(section, modId, lessonId, total, lessonIndex) {
            const key = `${section}-${modId}`;
            
            // 1. Obtenemos las lecciones del módulo o creamos el arreglo por defecto
            const currentModule = LESSONS_DATABASE[key] || { items: [] };
            
            // 2. Guardamos TODO el módulo actual en el sessionStorage
            sessionStorage.setItem("current_module_items", JSON.stringify(currentModule.items));
            
            // 3. Guardamos la lección seleccionada
            const targetLessonData = currentModule.items[lessonIndex] || {
                id: lessonId,
                name: `Lesson ${lessonId}`,
                skillText: "Main idea questions require you to identify the central point of the passage.",
                strategyText: "Read the first sentence of each paragraph to locate the core message."
            };
            
            sessionStorage.setItem("current_lesson_data", JSON.stringify(targetLessonData));

            // 4. Redirigimos pasando también el índice
            window.location.href = `lessonview.html?section=${section}&moduleId=${modId}&lessonId=${lessonId}&total=${total}&index=${lessonIndex}`;

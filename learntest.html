<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn with Tofi - TOEFL ITP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col pb-28">

    <!-- ================= CABECERA MORADA ADAPTADA (PC Y MÓVIL) ================= -->
    <header class="w-full px-0 sm:px-4">
        <!-- El contenedor interno ahora tiene max-w-2xl para alinearse con el contenido inferior -->
        <div class="bg-indigo-600 text-white pt-6 pb-8 px-6 sm:rounded-b-[2rem] shadow-md relative overflow-hidden max-w-2xl mx-auto">
            
            <!-- Botón de regreso atrás -->
            <div class="mb-4">
                <button onclick="navigateTo('home')" class="text-white hover:text-indigo-200 transition duration-150 cursor-pointer p-1 rounded-lg hover:bg-indigo-700/50 flex items-center justify-center w-8 h-8" title="Volver al Dashboard">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                </button>
            </div>

            <!-- Contenido de la cabecera con Tofi -->
            <div class="flex items-center justify-between gap-4">
                <div class="flex-1">
                    <h1 class="text-2xl font-bold tracking-tight">Learn with Tofi</h1>
                    <p class="text-indigo-100 text-xs md:text-sm mt-1 leading-relaxed font-medium">
                        Master TOEFL skills step by step with short lessons and smart strategies.
                    </p>
                </div>
                
                <!-- Tu imagen de Tofi colocada dinámicamente -->
                <div class="w-20 h-20 md:w-24 md:h-24 flex-shrink-0 flex items-center justify-center bg-white rounded-2xl shadow-sm p-2">
                    <img src="Base TOFI Correcto.png" alt="Tofi Tutor" class="w-full h-full object-contain" onerror="this.src='ISOTIPO toefl_Mesa de trabajo real.png'" />
                </div>
            </div>

        </div>
    </header>

    <!-- ================= CONTENIDO PRINCIPAL: MENU DE SECCIONES ================= -->
    <main class="max-w-2xl w-full mx-auto px-5 mt-6 flex-1">
        <h2 class="text-base font-bold text-slate-900 mb-4 tracking-wide">Choose a section</h2>

        <div class="space-y-4">
            
            <!-- Opción 1: Listening -->
            <button onclick="selectSectionLessons('listening')" class="w-full bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-4 text-left shadow-sm hover:shadow-md hover:border-indigo-100 transition duration-200 cursor-pointer group">
                <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center text-2xl flex-shrink-0">
                    🎧
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-slate-800 text-base group-hover:text-indigo-600 transition-colors">Listening</h3>
                    <p class="text-gray-500 text-xs mt-0.5 leading-normal">Improve your listening skills and understanding.</p>
                </div>
                <div class="text-gray-400 group-hover:text-indigo-600 transition-colors px-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </button>

            <!-- Opción 2: Structure & Written Expression -->
            <button onclick="selectSectionLessons('structure')" class="w-full bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-4 text-left shadow-sm hover:shadow-md hover:border-indigo-100 transition duration-200 cursor-pointer group">
                <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-2xl flex-shrink-0">
                    ✏️
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-slate-800 text-base group-hover:text-indigo-600 transition-colors">Structure & Written Expression</h3>
                    <p class="text-gray-500 text-xs mt-0.5 leading-normal">Build strong grammar and sentence skills.</p>
                </div>
                <div class="text-gray-400 group-hover:text-indigo-600 transition-colors px-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </button>

            <!-- Opción 3: Reading -->
            <button onclick="selectSectionLessons('reading')" class="w-full bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-4 text-left shadow-sm hover:shadow-md hover:border-indigo-100 transition duration-200 cursor-pointer group">
                <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-2xl flex-shrink-0">
                    📖
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-slate-800 text-base group-hover:text-indigo-600 transition-colors">Reading</h3>
                    <p class="text-gray-500 text-xs mt-0.5 leading-normal">Develop your reading comprehension strategies.</p>
                </div>
                <div class="text-gray-400 group-hover:text-indigo-600 transition-colors px-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </button>

        </div>
    </main>

    <!-- ================= BARRA DE NAVEGACIÓN INFERIOR (LEARN ACTIVO) ================= -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 shadow-[0_-4px_12px_rgba(0,0,0,0.03)] z-50">
        <div class="max-w-2xl mx-auto flex justify-around items-center py-2.5 px-2">
            
            <button onclick="navigateTo('home')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 transition-colors duration-150 cursor-pointer flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21.75h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21.75h7.5" />
                </svg>
                <span class="text-[11px] font-medium">Home</span>
            </button>

            <button onclick="navigateTo('practice')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 transition-colors duration-150 cursor-pointer flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                </svg>
                <span class="text-[11px] font-medium">Practice</span>
            </button>

            <!-- Pestaña actual activa en morado -->
            <button onclick="navigateTo('learn')" class="flex flex-col items-center gap-1 text-indigo-600 transition-colors duration-150 cursor-pointer flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path d="M11.25 4.533A9.707 9.707 0 0 0 6 3a9.735 9.735 0 0 0-3.25.555.75.75 0 0 0-.5.707v14.25a.75.75 0 0 0 1 .707A8.237 8.237 0 0 1 6 18.75c1.995 0 3.823.707 5.25 1.886V4.533ZM12.75 20.636A8.214 8.214 0 0 1 18 18.75c1.026 0 2.004.19 2.903.535a.75.75 0 0 0 1-.707V4.328a.75.75 0 0 0-.5-.707A9.74 9.74 0 0 0 18 3a9.707 9.707 0 0 0-5.25 1.533v16.103Z" />
                </svg>
                <span class="text-[11px] font-semibold">Learn</span>
            </button>

            <button onclick="navigateTo('chat')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 transition-colors duration-150 cursor-pointer flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9c8.25-9-4.97 0-9-3.694-9-8.25 0-4.556 4.03-8.25 9-8.25 4.97 0 9 3.694 9 8.25Z" />
                </svg>
                <span class="text-[11px] font-medium">Chat</span>
            </button>

            <button onclick="navigateTo('profile')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 transition-colors duration-150 cursor-pointer flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                <span class="text-[11px] font-medium">Profile</span>
            </button>

        </div>
    </div>

    <!-- ================= LOGICA JAVASCRIPT GLOBLAL ================= -->
    <script>
        // Función para cambiar entre las páginas principales
        function navigateTo(targetSection) {
            if (targetSection === 'home') {
                window.location.href = 'dashboardtest.html';
            } else if (targetSection === 'practice') {
                window.location.href = 'indextest.html';
            } else if (targetSection === 'learn') {
                window.location.href = 'learntest.html';
            } else if (targetSection === 'chat') {
                window.location.href = 'tutortest.html';
            } else if (targetSection === 'profile') {
                window.location.href = 'profiletest.html';
            }
        }

        // Función que se disparará al elegir una sección de lección
        function selectSectionLessons(sectionName) {
        // Redirige pasando la sección como parámetro en la URL (?section=reading, por ejemplo)
        window.location.href = `moduleslist.html?section=${sectionName}`;
        }
    </script>
</body>
</html>

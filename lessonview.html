<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Lesson - Learn with Tofi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col pb-28">

    <!-- BARRA SUPERIOR CON PROGRESO -->
    <header class="max-w-2xl w-full mx-auto px-5 pt-6">
        <div class="flex items-center justify-between mb-3">
            <button onclick="window.history.back()" class="text-gray-500 hover:text-indigo-600 transition p-1 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
            </button>
            <span id="lesson-progress-text" class="text-xs font-bold text-gray-500 uppercase tracking-wider">Lesson 1 of 4</span>
            <div class="w-6"></div>
        </div>
        <!-- Línea de progreso visual superior -->
        <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
            <div id="progress-bar-fill" class="bg-indigo-600 h-full transition-all duration-300" style="width: 25%"></div>
        </div>
    </header>

    <!-- CONTENEDOR MULTI-PANTALLAS INTERACTIVAS -->
    <main id="view-content" class="max-w-2xl w-full mx-auto px-5 mt-6 flex-1 flex flex-col justify-between">
        <!-- El contenido se inyecta dinámicamente con JavaScript de acuerdo al paso actual -->
    </main>

<!-- BARRA DE NAVEGACIÓN INFERIOR CON SVG -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 shadow-[0_-4px_12px_rgba(0,0,0,0.03)] z-50">
    <div class="max-w-2xl mx-auto flex justify-around items-center py-2.5 px-2">
        <button onclick="location.href='dashboardtest.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 flex-1 text-[11px] font-medium cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
            <span>Home</span>
        </button>
        <button onclick="location.href='indextest.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 flex-1 text-[11px] font-medium cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" /></svg>
            <span>Practice</span>
        </button>
        <button onclick="location.href='learntest.html'" class="flex flex-col items-center gap-1 text-indigo-600 flex-1 text-[11px] font-semibold cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18c-2.305 0-4.408.867-6 2.292m0-14.25v14.25" /></svg>
            <span>Learn</span>
        </button>
        <button onclick="location.href='tutortest.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 flex-1 text-[11px] font-medium cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a.75.75 0 0 1-.816-.983 4.5 4.5 0 0 0 .558-2.12c-1.89-1.503-3.076-3.6-3.076-5.867A8.25 8.25 0 0 1 12 3.75c4.97 0 9 3.694 9 8.25Z" /></svg>
            <span>Chat</span>
        </button>
        <button onclick="location.href='profiletest.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-600 flex-1 text-[11px] font-medium cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg>
            <span>Profile</span>
        </button>
    </div>
</div>

        <script>
    // 1. Obtener parámetros de la URL
    const params = new URLSearchParams(window.location.search);
    const section = (params.get('section') || 'reading').toLowerCase();
    const moduleId = params.get('moduleId') || '4';
    const lessonId = parseInt(params.get('lessonId')) || 1;
    const totalLessons = parseInt(params.get('total')) || 4;

    // 2. Mapeo de imágenes por sección
    const TOFI_IMAGES = {
        reading: 'Reading TOFI Correcto.png',
        structure: 'Grammar TOFI Correcto.png',
        listening: 'Listening TOFI Correcto.png',
        default: 'Base TOFI Correcto.png'
    };
    const currentTofiImg = TOFI_IMAGES[section] || TOFI_IMAGES.default;

    // 3. Lectura Directa de sessionStorage
    let localData = sessionStorage.getItem("current_lesson_data");
    let rawData = {};

    if (localData) {
        try {
            rawData = JSON.parse(localData);
        } catch (e) {
            console.error("Error parseando sessionStorage", e);
        }
    }

    // Mapeo forzado con valores de fallback visibles si no hay datos
    const CONTENT_DATABASE = {
        title: rawData.name || rawData.title || "Understanding Main Ideas",
        skillText: rawData.skillText || rawData.skill_text || rawData.skill || rawData.desc,
        strategyText: rawData.strategyText || rawData.strategy_text || rawData.strategy,
        exampleSentence: rawData.exampleSentence || rawData.example_sentence || "Bats use echolocation to navigate in darkness.",
        exampleQuestion: rawData.exampleQuestion || rawData.example_question || "What is the primary topic of the sentence?",
        options: rawData.options || ["How bats navigate", "Types of food bats eat", "Why caves are dark", "The size of bats"],
        correctAnswer: rawData.correctAnswer !== undefined ? rawData.correctAnswer : 0,
        detailedFeedback: rawData.detailedFeedback || rawData.feedback || "The sentence explains how bats use echolocation to navigate.",
        rememberText: rawData.rememberText || rawData.remember || "Always focus on the central message."
    };

    // Si sigue viniendo indefinido desde el objeto, le asignamos el texto descriptivo
    if (!CONTENT_DATABASE.skillText) {
        CONTENT_DATABASE.skillText = "Main idea questions require you to identify the central point of the passage rather than getting lost in small details.";
    }
    if (!CONTENT_DATABASE.strategyText) {
        CONTENT_DATABASE.strategyText = "Read the first sentence of each paragraph to locate the core message, then ask yourself what the text is mostly about.";
    }

    let currentStep = 1;

    function renderStep() {
        const container = document.getElementById("view-content");
        const fill = document.getElementById("progress-bar-fill");
        const progText = document.getElementById("lesson-progress-text");

        if (progText) progText.innerText = `LESSON ${lessonId} OF ${totalLessons}`;
        if (fill) fill.style.width = `${(currentStep / 4) * 100}%`;

        if (!container) return;

        if (currentStep === 1) {
            container.innerHTML = `
                <div class="flex-1">
                    <div class="flex items-center justify-between gap-4 mt-2 mb-6">
                        <h2 class="text-2xl font-black text-slate-900 leading-tight">${CONTENT_DATABASE.title}</h2>
                        <img src="${currentTofiImg}" class="w-20 h-20 object-contain" onerror="this.src='ISOTIPO toefl_Mesa de trabajo real.png'">
                    </div>
                    <div class="space-y-6">
                        <div>
                            <h3 class="text-xs font-bold text-indigo-950 uppercase tracking-wider flex items-center gap-1.5">🐱 WHAT IS THIS SKILL?</h3>
                            <p class="text-gray-600 text-sm mt-2 leading-relaxed font-medium">${CONTENT_DATABASE.skillText}</p>
                        </div>
                        <div class="pt-2">
                            <h3 class="text-xs font-bold text-indigo-950 uppercase tracking-wider flex items-center gap-1.5">💡 TOFI'S STRATEGY</h3>
                            <p class="text-gray-600 text-sm mt-2 leading-relaxed font-medium">${CONTENT_DATABASE.strategyText}</p>
                        </div>
                    </div>
                </div>
                <button onclick="nextStep()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md mt-8 transition cursor-pointer text-center">Next ➔</button>
            `;
        } 
        else if (currentStep === 2) {
            let optionsHTML = "";
            CONTENT_DATABASE.options.forEach((opt, idx) => {
                optionsHTML += `
                    <button id="opt-${idx}" onclick="checkExampleAnswer(${idx})" class="w-full text-left bg-white border border-gray-100 hover:border-indigo-100 rounded-xl p-3.5 text-sm font-medium transition cursor-pointer flex items-center gap-3">
                        <span class="font-bold text-gray-400 text-xs">${String.fromCharCode(65 + idx)}.</span> ${opt}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="flex-1">
                    <h3 class="text-xs font-bold text-indigo-950 uppercase tracking-wider mb-3">✨ Quick Example</h3>
                    <p class="text-gray-500 text-xs font-semibold mb-3">Read the sentence below.</p>
                    <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 mb-5 text-sm text-slate-800 leading-relaxed font-medium">
                        "${CONTENT_DATABASE.exampleSentence}"
                    </div>
                    <p class="text-slate-900 font-bold text-sm mb-4">${CONTENT_DATABASE.exampleQuestion}</p>
                    <div class="space-y-2.5">${optionsHTML}</div>
                    <div id="example-feedback" class="hidden mt-5 p-4 border rounded-xl text-xs leading-relaxed transition-all duration-300"></div>
                </div>
                <button id="btn-next-step" onclick="nextStep()" class="hidden w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md mt-8 transition cursor-pointer text-center">Next ➔</button>
            `;
        } 
        else if (currentStep === 3) {
            container.innerHTML = `
                <div class="flex-1">
                    <h3 class="text-xs font-bold text-indigo-950 uppercase tracking-wider mb-4">🎯 Remember</h3>
                    <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 flex items-start gap-3 mb-8">
                        <span class="text-emerald-600 text-lg">✅</span>
                        <p class="text-emerald-950 text-sm leading-relaxed font-medium">${CONTENT_DATABASE.rememberText}</p>
                    </div>
                    <div class="w-full flex justify-center py-4">
                        <img src="Base TOFI Correcto.png" class="w-40 h-40 object-contain animate-bounce" onerror="this.src='ISOTIPO toefl_Mesa de trabajo real.png'">
                    </div>
                </div>
                <button onclick="finishOrNextLesson()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md mt-8 transition cursor-pointer text-center">
                    ${lessonId < totalLessons ? 'Next Lesson ➔' : 'Complete Skill ➔'}
                </button>
            `;
        } 
        else if (currentStep === 4) {
            // PASO 4: FELICITACIONES + OPCIONES DE NAVEGACIÓN + TOFI PERSONALIZADO
            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center text-center mt-4">
                    <div class="text-4xl mb-3">🎉 🥳 🎉</div>
                    <img src="${currentTofiImg}" class="w-36 h-36 object-contain mb-4" onerror="this.src='Base TOFI Correcto.png'">
                    <h2 class="text-2xl font-black text-slate-900">Great job!</h2>
                    <p class="text-gray-500 text-sm mt-2 font-medium max-w-xs">You're ready to practice this skill or continue learning.</p>
                </div>
                <div class="space-y-3 w-full mt-8">
                    <!-- Botón 1: Ir a practicar en la sección actual -->
                    <button onclick="location.href='indextest.html?section=${section}'" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition cursor-pointer text-center text-sm">
                        Go to Practice ➔
                    </button>
                    
                    <!-- Botón 2: Volver a la lista de lecciones del módulo -->
                    <button onclick="location.href='lessonslist.html?section=${section}&moduleId=${moduleId}'" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3.5 px-4 rounded-xl transition cursor-pointer text-center text-sm">
                        Back to Lessons
                    </button>
                </div>
            `;
        }
    }

    function nextStep() {
        currentStep++;
        renderStep();
    }

    function checkExampleAnswer(selectedIdx) {
        const correctIdx = CONTENT_DATABASE.correctAnswer;
        const feedbackBox = document.getElementById("example-feedback");
        const nextBtn = document.getElementById("btn-next-step");

        CONTENT_DATABASE.options.forEach((_, idx) => {
            const btn = document.getElementById(`opt-${idx}`);
            if (btn) {
                btn.onclick = null;
                btn.classList.remove('hover:border-indigo-100', 'cursor-pointer');
                btn.classList.add('cursor-not-allowed');
            }
        });

        if (selectedIdx === correctIdx) {
            document.getElementById(`opt-${selectedIdx}`).className = "w-full text-left border-2 border-emerald-500 bg-emerald-50 rounded-xl p-3.5 text-sm font-semibold text-emerald-900";
            feedbackBox.className = "mt-5 p-4 border border-emerald-100 bg-emerald-50 text-emerald-950 rounded-xl text-xs leading-relaxed font-medium";
            feedbackBox.innerHTML = `<span class="text-xs text-emerald-600 font-bold uppercase tracking-wider block mb-1">🎯 Correct!</span> ${CONTENT_DATABASE.detailedFeedback}`;
        } else {
            document.getElementById(`opt-${selectedIdx}`).className = "w-full text-left border-2 border-rose-500 bg-rose-50 rounded-xl p-3.5 text-sm font-semibold text-rose-900";
            if (document.getElementById(`opt-${correctIdx}`)) {
                document.getElementById(`opt-${correctIdx}`).className = "w-full text-left border-2 border-emerald-500 bg-emerald-50 rounded-xl p-3.5 text-sm font-semibold text-emerald-900";
            }
            feedbackBox.className = "mt-5 p-4 border border-rose-100 bg-rose-50 text-rose-950 rounded-xl text-xs leading-relaxed font-medium";
            feedbackBox.innerHTML = `<span class="text-xs text-rose-600 font-bold uppercase tracking-wider block mb-1">❌ Incorrect!</span> ${CONTENT_DATABASE.detailedFeedback}`;
        }

        feedbackBox.classList.remove("hidden");
        nextBtn.classList.remove("hidden");

    }
    function finishOrNextLesson() {
        if (lessonId < totalLessons) {
            const nextLessonId = lessonId + 1;
            
            // 1. Intentamos leer la lista de lecciones del módulo
            const moduleItemsRaw = sessionStorage.getItem("current_module_items");
            let moduleItems = moduleItemsRaw ? JSON.parse(moduleItemsRaw) : [];

            // 2. Si existe la lección en la lista, la guardamos como la lección actual
            if (moduleItems && moduleItems[lessonId]) { // lessonId sirve como el siguiente índice
                sessionStorage.setItem("current_lesson_data", JSON.stringify(moduleItems[lessonId]));
            } else {
                // Generador dinámico para lecciones sin redactar aún
                const dynamicLesson = {
                    id: nextLessonId,
                    name: `Lesson ${nextLessonId}: Advanced Drill`,
                    skillText: `This is the overview for practice skill #${nextLessonId} in this module.`,
                    strategyText: "Pay attention to context clues and elimination strategies.",
                    exampleSentence: "The results were inconclusive, requiring further investigation.",
                    exampleQuestion: "What does inconclusive mean?",
                    options: ["Definite", "Uncertain", "Final", "Clear"],
                    correctAnswer: 1,
                    detailedFeedback: "Inconclusive means not leading to a firm conclusion.",
                    rememberText: "Always review key terms before picking an answer."
                };
                sessionStorage.setItem("current_lesson_data", JSON.stringify(dynamicLesson));
            }

            // 3. Redirigimos a la siguiente lección
            window.location.href = `lessonview.html?section=${section}&moduleId=${moduleId}&lessonId=${nextLessonId}&total=${totalLessons}`;
        } else {
            currentStep = 4;
            renderStep();
        }
    }

    document.addEventListener("DOMContentLoaded", renderStep);
    </script>
</body>
</html>
